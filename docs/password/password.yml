openapi: 3.0.0
info:
  title: Vizmaster AI
  version: 1.0.0

paths:
  users/auth/password_reset:
    post:
      tags:
        - Password Management
      summary: Password Reset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: bhanu@gmail.com


      parameters:
        - name: Email
          in: body
          schema:
            type: string
            nullable: false
          description: Email of the user
      responses:
        '200':
          description: Successful response
          content:
            application/json: 
              schema:
                type: object
                example: 
                  message: Password reset email has been sent.

        '404':
          description: 404Resource not found
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Resource not found"
         
        '405':
          description: 405Method Not Allowed
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Method \"GET\" not allowed."

  
  users/auth/password_change_by_admin/:
    post:
      tags:
        - Password Management
      summary: Password Change by Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
               "admin_uid": "c8a3253a-e335-4b1e-8521-229b63bc6860"
               "company_uid": "bcfdb2d8-a3d6-427a-a68d-1750db9f5ec9"
               "company_user_uid": "6273cf6a-1150-4846-bde8-f3dbbd6ccb2d"
               "password1": "Gleecus123"
               "password2": "Gleecus123"
               "user_type": "Application"

      parameters:
        - name: Authorization
          in: body
          schema:
            type: string
            nullable: false
          description: Authorization token
        - name: admin_uid
          in: body
          schema:
            type: string
            nullable: false
          description: Admin UID 
        - name: company_uid
          in: body
          schema:
            type: string
            nullable: false
          description: company UID 
        - name: company_user_uid
          in: body
          schema:
            type: string
            nullable: false
          description: company user UID
        - name: password1
          in: body
          schema:
            type: string
            nullable: false
          description: New password 
        - name: password2
          in: body
          schema:
            type: string
            nullable: false
          description: Confirm password
        - name: user_type
          in: body
          schema:
            type: string
            nullable: false
          description: user type             
      responses:
        '200':
          description: Successful response
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Password Changed successfully"

        
        '400':
          description: 404Bad Request
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Passwords do not match"
        
        '401':
          description: 401Unauthorized
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Authentication credentials were not provided."

        
        '403':
          description: 403Forbidden
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "You do not have permission to perform this action."
              

        
        '404':
          description: 404Not Found
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "The given Company/UUID doesnot exists!"    
        
        '405':
          description: 405Method Not Allowed
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Method \"GET\" not allowed."
        


  users/auth/password_change/:
    post:
      tags:
        - Password Management
      summary: Self Password Change 
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
               current_password: test123
               password1: test1234
               password2: test1234

      parameters:
        - name: Authorization
          in: body
          schema:
            type: string
            nullable: false
          description: Authorization token    
        - name: current_password
          in: body
          schema:
            type: string
            nullable: false
          description: Current Password
        - name: password1
          in: body
          schema:
            type: string
            nullable: false
          description: New Password
        - name: password2
          in: body
          schema:
            type: string
            nullable: false
          description: Confirm Password 
    
          
      responses:
        '200':
          description: Successful response
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Password Changed successfully"

        '400':
          description: 400Bad Request
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Current Password is incorrect"
            text/json: 
              schema:
                type: object
                example: 
                  "message": "New Password should not be same as Current Password"

        '401':
          description: 401Unauthorized
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Authentication credentials were not provided."

        '404':
          description: 404Not Found
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Resource not found"
        

        '405':
          description: 405Method Not Allowed
          content:
            application/json: 
              schema:
                type: object
                example: 
                  "message": "Method \"GET\" not allowed."
       
