site_name: Vizmaster AI API Documentation
site_url : https://mydomain.org/mysite

theme:
  name: material
  features:
    - content.code.copy

plugins:
  - search
  - offline
  - neoteroi.mkdocsoad:
      use_pymdownx: true

nav:
  - Home: index.md
  - Admin Management:
    - Onboard : admin-register/admin-register.md
    - Management : admin-manage/admin-manage.md
  - Company Management:
    - Company CRUD: company/company.md
    - User Onboarding: company-register/company-register.md
  - User Management:
    - Authentication : user/user.md
    - Password Management: password/password.md
    - User Managing: user-manage/user-manage.md
  - DB Connection : db-connect/db-connect.md
  - OAuth : oauth/oauth.md
  # - example: example/example.md

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/mkdocsoad.css

# For custom localhost mkdocs serve --dev-addr=127.0.0.1:5000
