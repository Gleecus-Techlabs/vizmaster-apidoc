  manage_users/self_update_admin_profile/{admin_uid}/:
    put:
      tags:
        - Admin Users Manage
      summary: Self update admin profile using `admin_uid`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: hajera+7@gleecus.com
                first_name: Hajera
                last_name: Nkhan
                username: Hajera7
                profile: >-
                  https://vizmaster-user-bucket.s3.amazonaws.com/users/33cc53c2-d272-4d7b-906f-34d1c86cf4ad/akrales_190424_3301_0426.jpg

      parameters:

        - name: admin_uid
          in: URL
          schema:
            type: string
          description: Admin UUID for<br> profile update

        - name: Authorization
          in: header
          schema:
            type: string
          description: Authorization Token  

        - name: email
          in: body
          schema:
            type: string
          description: User Email address  

        - name: first_name
          in: body
          schema:
            type: string
            nullable: true  
          description: User First name  


        - name: last_name
          in: body
          schema:
            type: string  
            nullable: true
          description: User Last name    

        - name: username
          in: body
          schema:
            type: string  
            nullable: true  
          description: Username  

        - name: profile
          in: body
          schema:
            type: string 
            nullable: true   
          description: Profile Image URL  
          
      responses:
        '200':
          description: Successful response
          content:
            application/json: 
              schema:
