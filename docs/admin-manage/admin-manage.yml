  manage_users/admin_profile_upload/:
    post:
      tags:
        - Admin Users Manage
      summary: Admin user profile image upload 
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          description : Authorization Token
        - name: admin_uid
          in: body
          schema:
            type: string
          description: UUID of admin user<br>whose profile is to<br>be updated
        - name: admin_profile
          in: body
          schema:
            type: file
          description: Upload profile image

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              example:
                admin_uid: 659a7ec6-9a1f-40c2-8d22-65b25da31797
                admin-profile:
                  type: file
                  format: binary
                  
            example:
              admin_uid: 659a7ec6-9a1f-40c2-8d22-65b25da31797
              admin-profile: [postman-cloud:///1ef910fa-29be-4f40-9be7-b600c8db1384]
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}